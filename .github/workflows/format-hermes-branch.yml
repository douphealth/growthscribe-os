name: Format Hermes feature branch

on:
  push:
    branches:
      - feat/hermes-autonomous-growth-20260831

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-autonomous-growth-20260831
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed TypeScript files
        run: |
          bunx prettier --write \
            src/lib/autonomous-growth.server.ts \
            src/routes/api/public/cron/worker.ts \
            src/routes/api/public/cron/scan.ts \
            src/__tests__/autonomous-growth.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/autonomous-growth.server.ts src/routes/api/public/cron/worker.ts src/routes/api/public/cron/scan.ts src/__tests__/autonomous-growth.test.ts
          git commit -m "style: format Hermes autonomous growth changes"
          git push origin HEAD:feat/hermes-autonomous-growth-20260831
