name: Diagnose Hermes feature branch

on:
  push:
    branches:
      - feat/hermes-autonomous-growth-20260831

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-autonomous-growth-20260831
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          : > .ci-diagnostics.txt
          for cmd in typecheck lint test build; do
            echo "===== $cmd =====" >> .ci-diagnostics.txt
            bun run "$cmd" >> .ci-diagnostics.txt 2>&1
            echo "EXIT=$?" >> .ci-diagnostics.txt
          done
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics.txt
          git commit -m "chore: capture Hermes CI diagnostics"
          git push origin HEAD:feat/hermes-autonomous-growth-20260831
