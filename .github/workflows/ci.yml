name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR workflows check out a synthetic merge commit. Full history keeps
          # the base merge point available to the changed-file formatting gate.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Install the Supabase CLI for type generation / drift check.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Static schema-shape checks (no network).
      - name: Verify generated Supabase types
        run: bun run db:types:verify

      # Regenerate types from the live schema and fail on any diff vs committed.
      - name: Check Supabase types drift
        if: ${{ env.VITE_SUPABASE_PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != '' }}
        run: bun run db:types:check

      # The repository predates the current Prettier baseline. Enforce formatting
      # on every file a PR changes without allowing legacy formatting debt to hide
      # semantic ESLint failures elsewhere in the codebase.
      - name: Check formatting of changed files
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
              | grep -E '\.(js|jsx|ts|tsx|json|css|md|yml|yaml)$' || true
          )
          if (( ${#changed_files[@]} > 0 )); then
            bunx prettier --check "${changed_files[@]}"
          fi

      - name: Run CI (typecheck, lint, test, build)
        run: bun run ci
